const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const xi2 = xi & 255, yi2 = yi & 255;
  const x1 = (xi2 + 1) & 255, y1 = (yi2 + 1) & 255;

  const v = yf * yf * (3 - 2 * yf);

  const b = _N[_P[(_P[x1] + yi2) & 255]];
  const c = _N[_P[(_P[xi2] + y1) & 255]];
  const d = _N[_P[(_P[x1] + y1) & 255]];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function nz(t, a = 1.0) {

function ink(r, c) {

function heart_f(hx, hy, s) {

function env_style(r, c, x, y, hs, hs2) {
  if (x < EX0 || x > EX1 || y < EY0 || y > EY1) return null;
  const hx_ = (x - CX) / HR;
  const hy_ = (HCY - y) / HR;
  if (-1.4 < hx_ && hx_ < 1.4 && -1.3 < hy_ && hy_ < 1.6 && heart_f(hx_, hy_, 1.0) <= 0) {
    const k = clamp(0.5 - 0.30 * hx_ + 0.28 * hy_);

    if (heart_f(hx_, hy_, 0.70) > 0) return ['&%#'[Math.floor(hs * 3) % 3], mix([0.86, 0.40, 0.58], [1.0, 0.74, 0.86], k)];
    if ((hx_ + 0.40) * (hx_ + 0.40) + (hy_ - 0.60) * (hy_ - 0.60) < 0.045) return ['*', [1.0, 0.93, 0.97]];
    return ['@%'[hs2 > 0.82 ? 1 : 0], mix([0.74, 0.24, 0.44], [0.97, 0.60, 0.76], k)];

  if (ink(r - 1, c - 1)) return ['%', [0.55, 0.34, 0.14]];
  if (ink(r - 1, c) || ink(r + 1, c) || ink(r, c - 1) || ink(r, c + 1)) return ['.', [0.16, 0.09, 0.05]];
  const fh = FLAP_H * (1 - Math.abs(x - CX) / (EW / 2));
  const dfl = EY0 + fh - y;
  if (Math.abs(dfl) < 0.45 * CH) return [x < CX ? '\\' : '/', INK];
  let side = false;
  if (dfl < 0) {
    if (x <= XPL) {
      const yl = EY1 + (YPL - EY1) * (x - EX0) / (XPL - EX0);
      if (Math.abs(y - yl) < 0.45 * CH) return ['/', INK];
      side = y < yl;
    } else if (x >= XPR) {
      const yr = YPL + (EY1 - YPL) * (x - XPR) / (EX1 - XPR);
      if (Math.abs(y - yr) < 0.45 * CH) return ['\\', INK];
      side = y < yr;
    }

}

function leaf_hit(x, y, ax, ay, ang, L, Wd, bend) {

  const dx = x - ax, dy = y - ay;
  const s = (dx * ca - dy * sa) / L;
  if (s < 0 || s > 1) return null;
  const v = dx * sa + dy * ca - bend * L * s * s;
  const w = Wd * Math.sin(Math.PI * Math.pow(s, 0.7)) * (1 + 0.07 * Math.sin(s * 38));
  if (w <= 0.3 || Math.abs(v) > w) return null;
  return [s, v / w];
}

function layer_b(k, th) {
  const R = LAYERS[k][0], n = LAYERS[k][1], ph = LAYERS[k][2], amp = LAYERS[k][3];
  const s = pmod((th + ph) * n / (2 * Math.PI), 1.0);
  return [R * (1 - amp * (1 - Math.pow(s, 0.55))), s];
}

function petal_hit(x, y, bx, by, tx, ty, hw) {
  const ax = tx - bx, ay = ty - by;
  const L = Math.hypot(ax, ay);
  if (L < 1e-6) return null;
  const ux = ax / L, uy = ay / L;
  const dx = x - bx, dy = y - by;
  const s = (dx * ux + dy * uy) / L;
  if (s < 0 || s > 1) return null;
  const v = -dx * uy + dy * ux;
  const w = hw * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.85)), 0.85);
  if (w <= 1e-6 || Math.abs(v) > w) return null;
  return [s, v / w];
}

      const ty = th_[0], sg = th_[1];
      const f = (y - ty) / (0.028 * H);
      if (f >= 0 && f <= 1) {
        const e = (x - sxv) * sg - STEM_HW;
        if (e >= 0 && e <= 2.6 * CW * f) return ['thorn', sg];
      }
    }
    for (const lv of LEAVES) {
      const ayy = RY + lv[0] * RR;
      const h_ = leaf_hit(x, y, stem_x(ayy), ayy, lv[1], lv[2] * RR, lv[3] * RR, lv[4]);
      if (h_ !== null) return ['leaf', h_[0], h_[1]];
    }
  }
  return null;
}

function rch(I) {
  return RCH[Math.floor(clamp(0.20 + 0.80 * I) * (RCH.length - 0.01))];
}

function contrast(I) {
  return clamp(0.52 + (I - 0.45) * 1.45);
}

function rose_style(smp, hs, hs2) {
  const kind = smp[0];
  if (kind === 'tpetal') {
    const k = smp[1], s = smp[2], v = smp[3];
    const e = Math.abs(v);
    let I = 0.28 + 0.58 * Math.pow(s, 0.85);
    if (s < 0.14) I *= 0.45 + 4.0 * s;
    if (e > 0.74) I *= 0.50 + 0.50 * (1 - e) / 0.26;
    if (k === 0) I += 0.12 * (1 - e) * (1 - e) * Math.pow(s, 0.55);
    else I *= 0.84;
    I *= 0.92 + 0.12 * Math.sin(s * 26 + e * 6 + hs * 18);
    I = contrast(clamp(I * (0.94 + 0.10 * hs)));
    if (hs2 > 0.985 && s > 0.55) return ['*', [1.0, 0.85, 0.90]];
    return [rch(I), PINK[Math.floor(I * 63)]];
  }
  if (kind === 'tbase') {
    const bx = smp[1], by = smp[2];
    let I = 0.26 + 0.24 * (0.5 - 0.5 * by) + 0.10 * (0.5 - 0.5 * bx);
    I *= 0.90 + 0.10 * Math.sin(bx * 9 + by * 7 + hs * 18);
    I = contrast(clamp(I * (0.94 + 0.10 * hs)));
    return [rch(I), PINK[Math.floor(I * 63)]];
  }
  if (kind === 'recept') {
    return ['@', mix([0.06, 0.20, 0.08], [0.14, 0.42, 0.17], clamp(0.5 - 0.5 * smp[1]))];
  }
  if (kind === 'stem') {
    const v = smp[1];
    return [hs < 0.85 ? '|' : ':', mix(GREEN_D, GREEN_L, clamp(0.5 - 0.5 * v))];
  }
  if (kind === 'thorn') {
    return [smp[1] > 0 ? '>' : '<', [0.62, 0.12, 0.08]];
  }
  const s = smp[1], v = smp[2];
  const av = Math.abs(v);
  if (av < 0.07) return [':', [0.34, 0.74, 0.36]];
  const vein = pmod(s * 8.0 - av * 1.4, 1.0);
  if (vein < 0.11 && kind === 'leaf') return [';', [0.14, 0.46, 0.20]];
  let t_ = Math.pow(clamp(1 - av), 1.25) * 0.86 + 0.14 * hs;
  t_ *= 0.78 + 0.34 * (0.5 + 0.5 * v);
  if (av > 0.88) t_ *= 0.82;
  return [['%', '&', '#'][Math.floor(hs * 3) % 3], mix(GREEN_D, GREEN_L, clamp(t_))];
}

function fpos(f, s) {
  const ts = f[0], tk_ = f[1], sx_ = f[2], sy_ = f[3], tx = f[4], ty = f[5];
  const nx = f[6], ny = f[7], amp = f[8], lift = f[9], ph = f[10];
  const e = s * s * (3 - 2 * s);
  const sn = Math.sin(Math.PI * s);
  const x = sx_ + (tx - sx_) * e + nx * amp * sn + 3.0 * S * Math.sin(s * 13 + ph) * (1 - s);
  const y = sy_ + (ty - sy_) * e + ny * amp * sn - lift * sn;
  return [x, y];
}

function bg_tables(tt) {
  for (let i = 0; i < NB; i++) {
    const a = -Math.PI + (i + 0.5) * (2 * Math.PI / NB);
    const r1 = Math.pow(0.5 + 0.5 * Math.sin(a * 23 + 1.6 * Math.sin(a * 3 + tt * 0.15) + tt * 0.10), 6);
    const r2 = Math.pow(0.5 + 0.5 * Math.sin(a * 47 - tt * 0.12 + 1.5 * Math.sin(a * 5 - tt * 0.10)), 9);
    const r3 = Math.pow(0.5 + 0.5 * Math.sin(a * 11 + tt * 0.08), 4);
    RAYF[i] = 0.55 * r1 + 0.50 * r2 + 0.20 * r3;
    let mn = 0.0;
    for (let k = 0; k < 8; k++) {
      const d = Math.abs(pmod(a - k * Math.PI / 4 + Math.PI, 2 * Math.PI) - Math.PI);
      if (d < 0.3) mn += (k % 2 === 0 ? 1.0 : 0.65) * Math.exp(-Math.pow(d / 0.045, 2)) * (0.88 + 0.12 * Math.sin(tt * 0.9 + k * 1.3));
    }
    RAYM[i] = mn;
  }
}

function bg_eval(e, tt, gt) {
  const ab = e[2], dn = e[3], halo = e[4];
  const core = Math.exp(-dn * 2.8);
  const glow = Math.exp(-dn * 1.3);
  let I = (0.95 * core + 0.16 * glow
    + 0.62 * RAYF[ab] * Math.exp(-dn * 1.9)
    + 0.85 * RAYM[ab] * Math.exp(-dn * 1.05)) * gt;
  if (halo) I *= 0.22;
  if (I < 0.05) return null;
  I = Math.min(I, 1.3);
  const ch = BGRAMP[Math.min(BGRAMP.length - 1, Math.floor(I * BGRAMP.length * 0.8))];
  return [ch, BLUE[Math.floor(clamp(I) * 63)]];
}

function draw_ambient(t, dt, gt, newC) {
  const base = 0.20 + 0.80 * gt;
  for (const s of STARS) {
    const v = 0.5 + 0.5 * Math.sin(t * s[3] + s[2]);
    if (v > 0.35) {
      const a = base * (v - 0.35) / 0.65;
      const ch = v > 0.9 ? '*' : v > 0.7 ? '+' : '.';
      newC.set(K(s[0], s[1]), [ch, sc(mix([0.70, 0.85, 1.0], WHITE, v), 0.25 + 0.75 * a)]);
    }
  }
  if (gt < 0.02) return;
  for (const p of MOTES) {
    p[1] -= p[2] * dt;
    p[0] += 6 * S * Math.sin(t * 0.8 + p[3]) * dt;
    if (p[1] < -4) { p[1] = H + 4; p[0] = rng() * W; }
    const rr = Math.floor(p[1] / CH), cc = Math.floor(p[0] / CW);
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && !ROSEMASK.has(K(rr, cc))) {
      const v = gt * p[4] * (0.5 + 0.5 * Math.sin(t * 1.7 + p[3]));
      if (v > 0.12) newC.set(K(rr, cc), [v < 0.5 ? '.' : ':', sc(mix(LIGHTC, WHITE, p[4]), 0.4 + 0.6 * v)]);
    }
  }
}

function _pip(px, py) {
  let ins = false;
  let j = POLY.length - 1;
  for (let i = 0; i < POLY.length; i++) {
    const xi = POLY[i][0], yi = POLY[i][1];
    const xj = POLY[j][0], yj = POLY[j][1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi + 1e-9) + xi) ins = !ins;
    j = i;
  }
  return ins;
}

function _pdist(px, py) {
  let best = 1e9;
  for (let i = 0; i < POLY.length; i++) {
    const ax = POLY[i][0], ay = POLY[i][1];
    const bx = POLY[(i + 1) % POLY.length][0], by = POLY[(i + 1) % POLY.length][1];
    const vx = bx - ax, vy = by - ay;
    const L2 = vx * vx + vy * vy + 1e-9;
    const t_ = clamp(((px - ax) * vx + (py - ay) * vy) / L2);
    const d = Math.hypot(px - (ax + vx * t_), py - (ay + vy * t_));
    if (d < best) best = d;
  }
  return best;
}

function cursor_pos(t) {
  const s = clamp((t - T_CUR0) / (T_CUR1 - T_CUR0));
  const k = 1 - Math.pow(1 - s, 3.5);
  const p0 = [1.10 * W, 0.04 * H];
  const p1 = [0.95 * W, 0.80 * H];
  const p2 = [0.64 * W, 0.78 * H];
  const p3 = [TGX, TGY];
  const u = 1 - k;
  const x = u * u * u * p0[0] + 3 * u * u * k * p1[0] + 3 * u * k * k * p2[0] + k * k * k * p3[0];
  const y = u * u * u * p0[1] + 3 * u * u * k * p1[1] + 3 * u * k * k * p2[1] + k * k * k * p3[1];
  return [x, y];
}

function bed_k(t) {
  const a = clamp((t - (T_BURN + 0.25)) / 1.2);
  const b = clamp((t - (T_BURN + T_SPREAD + 0.6)) / 1.6);
  return ease(a) * (1 - ease(b));
}

function fire_step(src, t) {
  const out = new Map();
  if (src.size === 0 && !st.hot) return out;
  const last = COLS - 1;
  const fr = frame;
  let anyhot = false;
  for (let r = 0; r < ROWS; r++) {
    const row = HEAT[r], b1 = HEAT[r + 1], b2 = HEAT[r + 2];
    for (let c = 0; c < COLS; c++) {
      const q = rng();
      let w = q < 0.27 ? c - 1 : q > 0.73 ? c + 1 : c;
      if (w < 0) w = 0;
      else if (w > last) w = last;
      const cl = c > 0 ? c - 1 : 0;
      const cr = c < last ? c + 1 : last;
      const v = (b1[w] * 2 + b1[cl] + b1[cr] + b2[c]) * 0.2 - (0.030 + 0.062 * ((q * 7.0) % 1.0));
      row[c] = v > 0 ? v : 0.0;
    }
  }
  for (const [k, v] of src) {
    const r = Math.floor(k / COLS), c = k - r * COLS;
    if (v > HEAT[r][c]) HEAT[r][c] = v;
  }
  for (let r = 0; r < ROWS; r++) {
    const row = HEAT[r];
    for (let c = 0; c < COLS; c++) {
      const v = row[c];
      if (v > 0.10) {
        anyhot = true;
        const i = Math.min(10, Math.floor(v * 10.5));
        const s_ = FSET[i];
        out.set(K(r, c), [s_[(c * 3 + r * 7 + fr) % s_.length], LUT[Math.floor(clamp(v) * 63)]]);
      } else if (v > 0.01) {
        anyhot = true;
      }
    }
  }
  st.hot = anyhot;
  return out;
}

function draw_cursor(t, newC) {
  const a = clamp((t - T_CUR0) / 0.3);
  const bt = t - T_BURN;
  if (a <= 0 || bt > 1.1) return;
  const pos = cursor_pos(t);
  let c0 = Math.floor(pos[0] / CW), r0 = Math.floor(pos[1] / CH);
  const press = T_CLICK <= t && t < T_CLICK + 0.20;
  if (press) { c0 += 1; r0 += 1; }
  const bk = bt > 0 ? clamp(bt) : 0.0;
  if (T_CUR0 < t && t < T_CUR1 + 0.15) {
    for (let q = 1; q <= 10; q++) {
      const tp = cursor_pos(t - 0.05 * q);
      const rr = Math.floor(tp[1] / CH), cc = Math.floor(tp[0] / CW);
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
        const v = (1 - q / 11.0) * 0.8;
        newC.set(K(rr, cc), [q < 4 ? '+' : '.', [0.58 * v, 0.24 * v, 0.95 * v]]);
      }
    }
  }
  for (const e of CUR_SHAD) {
    const rr = r0 + e[0], cc = c0 + e[1];
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && bk < 0.5) {
      const und = newC.get(K(rr, cc));
      const ucol = und ? und[1] : BG;
      newC.set(K(rr, cc), [':', mix(ucol, [0.03, 0.01, 0.06], 0.65 * a)]);
    }
  }
  for (const e of CUR_GLOW) {
    const rr = r0 + e[0], cc = c0 + e[1];
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && e[3] < 0.7 && bk < 0.6) {
      const v = a * e[2] * (1 - bk) * 0.85;
      newC.set(K(rr, cc), [e[2] > 0.5 ? ':' : '.', [0.55 * v, 0.18 * v, 0.78 * v]]);
    }
  }
  for (const e of CUR_EDGE) {
    if (e[2] < bk) continue;
    const rr = r0 + e[0], cc = c0 + e[1];
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
      let col = [0.98, 0.86, 1.0];
      if (press) col = [1.0, 1.0, 1.0];
      if (bk > 0) col = mix(col, LUT[Math.floor(clamp(0.55 + 0.4 * (1 - e[2])) * 63)], clamp(bk * 1.6));
      newC.set(K(rr, cc), ['#', sc(col, a)]);
    }
  }
  for (const e of CUR_FILL) {
    if (e[4] < bk) continue;
    const rr = r0 + e[0], cc = c0 + e[1];
    if (!(rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS)) continue;
    let col = e[3];
    if (press) col = mix(col, [1.0, 0.96, 1.0], 0.55);
    if (bk > 0) col = mix(col, LUT[Math.floor(clamp(0.55 + 0.4 * (1 - e[4])) * 63)], clamp(bk * 1.6));
    newC.set(K(rr, cc), [e[2], sc(col, a)]);
  }
}

function ring_cells(cx, cy, pad) {
  const out = [];
  const r0 = Math.max(0, Math.floor((cy - pad) / CH));
  const r1 = Math.min(ROWS, Math.floor((cy + pad) / CH) + 1);
  const c0 = Math.max(0, Math.floor((cx - pad) / CW));
  const c1 = Math.min(COLS, Math.floor((cx + pad) / CW) + 1);
  for (let rr = r0; rr < r1; rr++) {
    const y = (rr + 0.5) * CH;
    for (let cc = c0; cc < c1; cc++) out.push([rr, cc, (cc + 0.5) * CW, y]);
  }
  return out;
}

function draw_click(t, dt, newC) {
  const a = t - T_CLICK;
  if (!st.click && a >= 0) {
    st.click = true;
    for (let i = 0; i < 52; i++) {
      const ang = rng() * 2 * Math.PI;
      const sp = uniform(120, 560) * S;
      bits.push([TGX, TGY, Math.cos(ang) * sp, Math.sin(ang) * sp, 0.0, uniform(0.5, 1.1)]);
    }
  }
  if (a < 0 || a > 1.2) return;
  if (a < 0.25) {
    const k = a / 0.25;
    const rad = 0.03 * EFF + 0.05 * EFF * k;
    for (const rc of ring_cells(TGX, TGY, rad + CW)) {
      const rr = rc[0], cc = rc[1];
      const d = Math.hypot(rc[2] - TGX, rc[3] - TGY);
      if (d < rad) {
        const v = (1 - k) * (1 - d / rad * 0.5);
        const und = newC.get(K(rr, cc));
        const col = mix([1.0, 0.9, 1.0], [0.85, 0.5, 1.0], k);
        newC.set(K(rr, cc), [v > 0.5 ? '@' : '#', und ? mix(und[1], col, clamp(v * 1.3)) : sc(col, v)]);
      }
    }
  }
  for (const rd of [[0.0, [0.65, 0.30, 1.0], [1.0, 0.55, 0.9]], [0.13, [0.55, 0.25, 0.95], [1.0, 0.65, 0.95]], [0.26, [0.50, 0.30, 1.0], [1.0, 0.85, 1.0]]]) {
    const aa = a - rd[0];
    if (aa < 0 || aa > 0.9) continue;
    const k = aa / 0.9;
    const rad = 0.02 * EFF + 0.26 * EFF * (1 - Math.pow(1 - k, 2.2));
    const th = (1.7 - 1.0 * k) * CW;
    const al = Math.pow(1 - k, 1.2);
    const col = mix(rd[1], rd[2], k);
    for (const rc of ring_cells(TGX, TGY, rad + th)) {
      const rr = rc[0], cc = rc[1];
      const q = Math.abs(Math.hypot(rc[2] - TGX, rc[3] - TGY) - rad) / th;
      if (q >= 1) continue;
      const v = (1 - q) * al * 1.5;
      let c2 = sc(col, clamp(v));
      const und = newC.get(K(rr, cc));
      if (und) c2 = mix(und[1], col, clamp(v * 0.85));
      newC.set(K(rr, cc), [q < 0.35 ? 'O' : q < 0.65 ? 'o' : '.', c2]);
    }
  }
  if (a < 0.55) {
    const k = a / 0.55;
    const l0 = 0.03 * EFF + 0.05 * EFF * k;
    const l1 = 0.06 * EFF + 0.24 * EFF * (1 - Math.pow(1 - k, 2));
    const steps = Math.floor((l1 - l0) / (CW * 0.9)) + 1;
    for (let n = 0; n < 14; n++) {
      const ang = n * 2 * Math.PI / 14 + 0.2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const chr_ = Math.abs(ca) > 0.92 ? '-' : Math.abs(sa) > 0.92 ? '|' : (ca * sa > 0 ? '\\' : '/');
      for (let s_ = 0; s_ < steps; s_++) {
        const f = s_ / steps;
        const dist = l0 + (l1 - l0) * f;
        const rr = Math.floor((TGY + sa * dist) / CH), cc = Math.floor((TGX + ca * dist) / CW);
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
          const v = (1 - k) * (1 - 0.6 * f);
          newC.set(K(rr, cc), [chr_, sc(mix([1.0, 0.9, 1.0], [0.7, 0.35, 1.0], f), clamp(v * 1.3))]);
        }
      }
    }
  }
  const alive = [];
  for (const b of bits) {
    b[4] += dt;
    if (b[4] >= b[5]) continue;
    b[2] *= (1 - 2.0 * dt);
    b[3] = b[3] * (1 - 2.0 * dt) + 60 * S * dt;
    b[0] += b[2] * dt;
    b[1] += b[3] * dt;
    const k = b[4] / b[5];
    const rr = Math.floor(b[1] / CH), cc = Math.floor(b[0] / CW);
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
      newC.set(K(rr, cc), [k < 0.4 ? '*' : k < 0.7 ? '+' : '.', sc(mix([1.0, 0.92, 1.0], [0.62, 0.28, 0.95], k), 1 - 0.5 * k)]);
    }
    alive.push(b);
  }
  bits = alive;
}

function init() {
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(vw * DPR);
  cv.height = Math.round(vh * DPR);
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  const small = Math.min(vw, vh) < 700;
  const target = small ? 3600 : 6500;
  let fs = clamp(Math.sqrt((vw * vh) / (0.72 * target)), 10, 30);
  ctx.font = 'bold ' + fs + 'px ' + FAM;
  let mtr = ctx.measureText('M');
  let cw = mtr.width || fs * 0.6;
  let ch = (mtr.fontBoundingBoxAscent !== undefined ? mtr.fontBoundingBoxAscent + mtr.fontBoundingBoxDescent : 0) || fs * 1.2;
  let cells = (vw / cw) * (vh / ch);
  if (Math.abs(cells - target) > target * 0.15) {
    fs = clamp(fs * Math.sqrt(cells / target), 10, 30);
    ctx.font = 'bold ' + fs + 'px ' + FAM;
    mtr = ctx.measureText('M');
    cw = mtr.width || fs * 0.6;
    ch = (mtr.fontBoundingBoxAscent !== undefined ? mtr.fontBoundingBoxAscent + mtr.fontBoundingBoxDescent : 0) || fs * 1.2;
  }
  CW = cw; CH = ch;
  COLS = Math.max(24, Math.floor(vw / CW));
  ROWS = Math.max(20, Math.floor(vh / CH));
  W = COLS * CW; H = ROWS * CH;
  OX = (vw - W) / 2; OY = (vh - H) / 2;
  S = H / 640;
  EFF = Math.min(W, H);
  FONT = ctx.font;
  ctx.setTransform(DPR, 0, 0, DPR, OX * DPR, OY * DPR);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  rng = mulberry32(21);
  _P = [];
  for (let i = 0; i < 256; i++) _P.push(i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = _P[i]; _P[i] = _P[j]; _P[j] = t;
  }
  _N = [];
  for (let i = 0; i < 256; i++) _N.push(rng() * 2 - 1);

  HS = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) row.push(rng());
    HS.push(row);
  }
  HS2 = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) row.push(rng());
    HS2.push(row);
  }

  CX = W / 2.0;
  TXT = ['', '', '', '', ''];
  for (let i = 0; i < TEXT.length; i++) {
    for (let k = 0; k < 5; k++) {
      TXT[k] += GLYPH[TEXT[i]][k] + (i < TEXT.length - 1 ? '.' : '');
    }
  }
  TW = TXT[0].length;
  EW = Math.min(0.98 * W, Math.max(0.76 * W, (TW * 2 + 6) * CW));
  EH = 0.74 * EW;
  ECY = 0.55 * H;
  EX0 = CX - EW / 2; EX1 = CX + EW / 2;
  EY0 = ECY - EH / 2; EY1 = ECY + EH / 2;
  FLAP_H = 0.50 * EH;
  TIPY = EY0 + FLAP_H;
  HR = 0.08158 * EW;
  HCY = TIPY - 0.25 * HR;
  XPL = CX - 0.17 * EW; XPR = CX + 0.17 * EW;
  YPL = EY0 + FLAP_H * (1 - 0.17 * EW / (EW / 2));
  IGX = CX; IGY = HCY;

  TC0 = Math.floor(CX / CW - TW);
  TR0 = Math.floor((HCY + 1.2 * HR) / CH) + 2;

  const raw = [];
  const SHD = [];
  for (let r = 0; r < ROWS; r++) {
    const y = (r + 0.5) * CH;
    for (let c = 0; c < COLS; c++) {
      const x = (c + 0.5) * CW;
      const s_ = env_style(r, c, x, y, HS[r][c], HS2[r][c]);
      if (s_ !== null) raw.push([r, c, s_[0], s_[1], x, y]);
      else if (EX0 + 0.9 * CW <= x && x <= EX1 + 1.8 * CW && EY0 + 0.8 * CH <= y && y <= EY1 + 2.0 * CH) SHD.push([r, c, x, y]);
    }
  }
  let MAXD = 1;
  for (const e of raw) {
    const d = Math.hypot(e[4] - IGX, e[5] - IGY);
    if (d > MAXD) MAXD = d;
  }
  ENVC = [];
  SEALC = [];
  for (const e of raw) {
    const r = e[0], c = e[1], ch = e[2], col = e[3], x = e[4], y = e[5];
    const d = Math.hypot(x - IGX, y - IGY);
    const nzv = vn(x * 0.035 + 4, y * 0.035 + 9) * 0.5 + 0.5;
    const tb = T_SPREAD * Math.pow(d / MAXD, 0.92) + 0.6 * nzv * Math.min(1.0, d / (0.12 * H));
    ENVC.push([r, c, ch, col, tb, HS[r][c], HS2[r][c], x, y]);
    if (in_seal(x, y)) SEALC.push([r, c]);
  }
  ENV_SORTED = ENVC.slice().sort((a, b) => a[4] - b[4]);
  TBS = ENV_SORTED.map(e => e[4]);
  SHDC = [];
  for (const e of SHD) {
    const r = e[0], c = e[1], x = e[2], y = e[3];
    const d = Math.hypot(x - IGX, y - IGY);
    const tb = T_SPREAD * Math.pow(d / MAXD, 0.92);
    const ex = Math.max(0.0, x - EX1, EX0 - x);
    const ey = Math.max(0.0, y - EY1, EY0 - y);
    const f = 1 - clamp(Math.hypot(ex, ey) / (2.0 * CW));
    SHDC.push([r, c, f > 0.45 ? ':' : '.', sc([0.12, 0.08, 0.06], 0.35 + 0.65 * f), tb, HS[r][c]]);
  }

  BED = [];
  const RB0 = Math.floor(EY1 / CH) + 1;
  for (const rr of [RB0, RB0 + 1]) {
    if (rr >= ROWS) continue;
    for (let c = 0; c < COLS; c++) {
      const x = (c + 0.5) * CW;
      const u = 1 - Math.pow((x - CX) / (EW * 0.50), 2);
      if (u > 0.12) BED.push([rr, c, Math.sqrt(u), HS[rr][c], rr === RB0]);
    }
  }

  RX = CX;
  RR = 0.175 * H;
  RY = 0.290 * H;
  STEM_Y1 = 0.885 * H;
  HEAD_B = RY + 1.38 * RR;
  TOP_Y = RY - 1.1 * RR;
  STEM_HW = 0.80 * CW;
  THORNS = [[0.60 * H, 1], [0.69 * H, -1], [0.77 * H, 1]];

  const RAWR = [];
  for (let r = 0; r < ROWS; r++) {
    const y = (r + 0.5) * CH;
    for (let c = 0; c < COLS; c++) {
      const x = (c + 0.5) * CW;
      const smp = rose_sample(x, y);
      if (smp !== null) RAWR.push([r, c, smp, HS[r][c], HS2[r][c], x, y]);
    }
  }
  ROSEMASK = new Set(RAWR.map(e => K(e[0], e[1])));
  EDGE = new Set();
  HALO = new Set();
  for (const e of RAWR) {
    const r_ = e[0], c_ = e[1];
    if (!ROSEMASK.has(K(r_ + 1, c_)) || !ROSEMASK.has(K(r_ - 1, c_)) || !ROSEMASK.has(K(r_, c_ + 1)) || !ROSEMASK.has(K(r_, c_ - 1))) EDGE.add(K(r_, c_));
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const q = K(r_ + dr, c_ + dc);
        if (!ROSEMASK.has(q)) HALO.add(q);
      }
    }
  }
  ROSEC = [];
  for (const e of RAWR) {
    const r = e[0], c = e[1], smp = e[2], hs = e[3], hs2 = e[4], x = e[5], y = e[6];
    const rc_ = rose_style(smp, hs, hs2);
    const key = clamp((y - TOP_Y) / (STEM_Y1 - TOP_Y));
    const tk_ = T_R0 + 0.1 + key * T_FORM + rng() * 0.40;
    ROSEC.push([tk_, r, c, rc_[0], rc_[1], x, y, EDGE.has(K(r, c)), hs]);
  }
  RP = [];
  for (const e of ROSEC) {
    const tk_ = e[0], x = e[5], y = e[6];
    const lim = tk_ - T_BURN - 0.85;
    const n = upperBound(TBS, lim);
    const src = ENV_SORTED[Math.floor(rng() * Math.max(1, n))];
    if (!src) continue;
    const sx_ = src[7], sy_ = src[8];
    let ts = Math.max(T_BURN + src[4] + 0.1, tk_ - 2.2);
    ts = Math.min(ts, tk_ - 0.75);
    const dx_ = x - sx_, dy_ = y - sy_;
    const dd = Math.hypot(dx_, dy_) + 1e-6;
    RP.push([ts, tk_, sx_, sy_, x, y, -dy_ / dd, dx_ / dd, uniform(-0.12, 0.12) * dd, uniform(0.05, 0.13) * H, uniform(0, 6.28)]);
  }

  LX = RX;
  LY = RY;
  BGE = [];
  for (let r = 0; r < ROWS; r++) {
    const y = (r + 0.5) * CH;
    for (let c = 0; c < COLS; c++) {
      if (ROSEMASK.has(K(r, c))) continue;
      const x = (c + 0.5) * CW;
      const dx_ = x - LX, dy_ = y - LY;
      const a_ = Math.atan2(dy_, dx_);
      const dn = Math.hypot(dx_, dy_) / (0.55 * H);
      const ab = Math.floor(((a_ + Math.PI) / (2 * Math.PI)) * NB) % NB;
      BGE.push([r, c, ab, dn, HALO.has(K(r, c))]);
    }
  }
  BGCH = [[], [], []];
  for (let i = 0; i < BGE.length; i++) BGCH[i % NCH].push(BGE[i]);
  BGC = new Map();
  RAYF = new Float64Array(NB);
  RAYM = new Float64Array(NB);

  MOTES = [];
  for (let i = 0; i < 46; i++) {
    MOTES.push([rng() * W, rng() * H, uniform(0.01, 0.04) * H, rng() * 6.28, uniform(0.5, 1.0)]);
  }
  STARS = [];
  for (let i = 0; i < 60; i++) {
    const rr_ = Math.floor(rng() * ROWS), cc_ = Math.floor(rng() * COLS);
    if (!ROSEMASK.has(K(rr_, cc_))) STARS.push([rr_, cc_, rng() * 6.28, uniform(0.6, 2.2)]);
  }

  PH_ = 0.21 * EFF;
  POLY = ARW.map(p => [p[0] * PH_, p[1] * PH_]);
  CUR_FILL = []; CUR_EDGE = []; CUR_GLOW = []; CUR_SHAD = [];
  const occ = new Set();
  const NC_ = Math.floor(0.58 * PH_ / CW) + 3;
  const NR_ = Math.floor(PH_ / CH) + 3;
  for (let j = 0; j < NR_; j++) {
    for (let i = 0; i < NC_; i++) {
      let cin = 0, core = 0;
      for (const sy of [1 / 6, 3 / 6, 5 / 6]) {
        for (const sx of [1 / 6, 3 / 6, 5 / 6]) {
          const px = (i + sx) * CW, py = (j + sy) * CH;
          if (_pip(px, py)) {
            cin++;
            if (_pdist(px, py) > 0.9 * CW) core++;
          }
        }
      }
      const cxm = (i + 0.5) * CW, cym = (j + 0.5) * CH;
      const h_ = ((j * 7 + i * 13) % 10) / 10.0;
      if (core >= 5) {
        const t_ = clamp((cym / PH_) * 0.85 + (cxm / (0.58 * PH_)) * 0.15);
        let col = mix([0.52, 0.22, 0.97], [1.0, 0.42, 0.74], t_);
        const bev = _pdist(cxm, cym) < 1.8 * CW;
        if (bev) col = mix(col, [1.0, 0.92, 1.0], 0.20);
        CUR_FILL.push([j, i, bev ? '%' : '@', col, h_]);
        occ.add(K(j, i));
      } else if (cin >= 3) {
        CUR_EDGE.push([j, i, h_]);
        occ.add(K(j, i));
      } else {
        const d = _pdist(cxm, cym);
        if (d < 1.9 * CW) CUR_GLOW.push([j, i, 1 - d / (1.9 * CW), h_]);
      }
    }
  }
  for (const k of occ) {
    const j = Math.floor(k / COLS), i = k - j * COLS;
    if (!occ.has(K(j + 1, i + 1))) CUR_SHAD.push([j + 1, i + 1]);
  }

  TGX = CX - 0.004 * W;
  TGY = HCY - 0.015 * H;

  if (/[?&]info=1/.test(QS)) {
    startEl.style.display = 'none';
    const info = 'M ' + vw + 'x' + vh + ' dpr' + DPR + ' grid ' + COLS + 'x' + ROWS
      + ' cw' + CW.toFixed(2) + ' ch' + CH.toFixed(2) + ' fs' + fs.toFixed(1)
      + ' TC0 ' + TC0 + ' TR0 ' + TR0 + ' TW ' + TW
      + ' EX0 ' + EX0.toFixed(1) + ' EY0 ' + EY0.toFixed(1)
      + ' EW ' + EW.toFixed(1) + ' EH ' + EH.toFixed(1) + ' HR ' + HR.toFixed(1);
    document.title = info;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(info, 6, 6);
    ctx.setTransform(DPR, 0, 0, DPR, OX * DPR, OY * DPR);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
  }

  HEAT = [];
  for (let r = 0; r < ROWS + 2; r++) HEAT.push(new Float64Array(COLS));

  frame = 0;
  sparks = [];
  smoke = [];
  bits = [];
  st.burst = false;
  st.click = false;
  st.hot = false;
}

function upperBound(a, x) {
  let lo = 0, hi = a.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (x < a[mid]) hi = mid;
    else lo = mid + 1;
  }
  return lo;
}

function render(t, dt) {
  frame++;
  const newC = new Map();
  const gt = ease((t - T_GLOW) / 3.6);

  if (gt > 0.003) {
    if (frame % NCH === 0 || BGC.size === 0) bg_tables(t);
    for (const e of BGCH[frame % NCH]) {
      const res = bg_eval(e, t, gt);
      if (res) BGC.set(K(e[0], e[1]), res);
      else BGC.delete(K(e[0], e[1]));
    }
    for (const [k, v] of BGC) newC.set(k, v);
  }
  draw_ambient(t, dt, gt, newC);

  const tbn = t - T_BURN;
  const pin = clamp(t / T_ENV_IN);

  for (const e of SHDC) {
    const tb = e[4];
    if (tbn - tb >= 0) continue;
    const vis = pin * 1.3 - e[5] * 0.5;
    if (vis > 0) newC.set(K(e[0], e[1]), [e[2], sc(e[3], Math.min(1.0, vis * 1.6))]);
  }

  const front = [];
  const src = new Map();
  for (const e of ENVC) {
    const r = e[0], c = e[1], ch = e[2], hs = e[5], hs2 = e[6], x = e[7], y = e[8];
    let col = e[3];
    const tau = tbn - e[4];
    if (tau >= 1.35) continue;
    if (tau < 0) {
      const vis = pin * 1.3 - hs * 0.5;
      if (vis <= 0) continue;
      const k = Math.min(1.0, vis * 1.6);
      if (tbn > 0 && tau > -0.5) {
        const w = (tau + 0.5) * 2.0;
        col = mix(col, [0.30, 0.10, 0.03], w * 0.75);
        if (w > 0.6) col = mix(col, [1.0, 0.38, 0.05], (w - 0.6) * 1.3);
      }
      newC.set(K(r, c), [ch, [col[0] * k, col[1] * k, col[2] * k]]);
      continue;
    }
    if (tau < 0.50) src.set(K(r, c), 0.72 + 0.28 * rng());
    else if (tau < 0.95) src.set(K(r, c), (0.45 + 0.15 * rng()) * (1 - (tau - 0.50) / 0.45));
    if (tau < 0.38) {
      const q = tau / 0.38;
      const T = clamp(0.98 - 0.62 * q + 0.14 * nz(t * 9 + hs * 20));
      const ch2 = (q < 0.6 ? '@#&%' : '#%=+')[Math.floor(hs2 * 4) % 4];
      newC.set(K(r, c), [ch2, LUT[Math.floor(T * 63)]]);
      front.push([x, y]);
    } else {
      const a = 1 - (tau - 0.38) / 0.97;
      if (hs2 > Math.pow(a, 0.7)) continue;
      if (((hs * 37.0 + t * 1.6) % 1.0) > 0.84 - 0.08 * a) {
        newC.set(K(r, c), ['*', LUT[Math.floor(clamp(0.28 + 0.5 * a) * 63)]]);
      } else {
        const kk = 0.45 + 0.9 * a;
        newC.set(K(r, c), [['%', '#', '='][Math.floor(hs * 3) % 3], [0.13 * kk, 0.07 * kk, 0.05 * kk]]);
      }
    }
  }

  if (T_CUR1 - 0.3 <= t && t < T_BURN + 0.02) {
    let mf;
    if (t < T_CLICK) {
      const k = 0.28 * ease((t - (T_CUR1 - 0.3)) / 0.3) * (0.8 + 0.2 * Math.sin(t * 9));
      mf = col => mix(col, [1.0, 0.85, 1.0], k);
    } else if (t < T_CLICK + 0.20) {
      mf = col => sc(col, 0.62);
    } else {
      const k = 0.7 * (1 - clamp((t - T_CLICK - 0.2) / 0.15));
      mf = col => mix(col, [1.0, 0.9, 0.8], k);
    }
    for (const rc of SEALC) {
      const v = newC.get(K(rc[0], rc[1]));
      if (v) newC.set(K(rc[0], rc[1]), [v[0], mf(v[1])]);
    }
  }

  const bk = bed_k(t);
  if (bk > 0.01) {
    for (const e of BED) {
      const rr = e[0], cc = e[1], shp = e[2], hs = e[3], top = e[4];
      const fl = 0.5 + 0.5 * Math.sin(t * 6 + hs * 40);
      const T = clamp(bk * shp * (0.25 + 0.45 * fl + 0.2 * hs));
      if (T > 0.08) newC.set(K(rr, cc), [['=', '%', '#', '@'][Math.floor(hs * 4) % 4], LUT[Math.floor(T * 63)]]);
      if (top) src.set(K(rr, cc), bk * shp * (0.50 + 0.38 * rng()));
    }
    for (const e of BED) {
      if (e[4] && rng() < 0.5 * dt * 10 * bk * e[2]) front.push([(e[1] + 0.5) * CW, (e[0] + 0.5) * CH]);
    }
  }

  for (const [k, v] of fire_step(src, t)) newC.set(k, v);

  const rim = 0.65 * gt;
  for (const e of ROSEC) {
    const tk_ = e[0];
    if (t < tk_) continue;
    const r = e[1], c = e[2];
    let ch = e[3], col = e[4];
    const hs = e[8], ed = e[7];
    const heat = 1.0 - (t - tk_);
    if (heat > 0) {
      const hh = Math.pow(heat, 1.4);
      col = mix(col, LUT[Math.floor(clamp(0.35 + 0.65 * hh) * 63)], clamp(hh * 1.15));
      if (hh > 0.5) ch = '@';
    } else if (ed && rim > 0.01) {
      col = mix(col, [0.72, 0.88, 1.0], rim);
      if (hs > 0.9 && Math.sin(t * 3 + hs * 40) > 0.85) { ch = '*'; col = [0.88, 0.96, 1.0]; }
    }
    newC.set(K(r, c), [ch, col]);
  }

  for (const f of RP) {
    const ts = f[0], tk_ = f[1];
    if (t < ts || t >= tk_) continue;
    const s = (t - ts) / (tk_ - ts);
    for (const lag of [[0.0, '*', 1.0], [0.06, '+', 0.8], [0.12, '.', 0.6]]) {
      const ss = s - lag[0];
      if (ss < 0) break;
      const xy = fpos(f, ss);
      const rr = Math.floor(xy[1] / CH), cc = Math.floor(xy[0] / CW);
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
        const T = clamp((0.45 + 0.55 * s) * lag[2]);
        newC.set(K(rr, cc), [lag[1], LUT[Math.floor(T * 63)]]);
      }
    }
  }

  if (t >= T_BURN && !st.burst) {
    st.burst = true;
    for (let i = 0; i < 150; i++) {
      const a_ = uniform(-170, -10) * D2R;
      const sp_ = uniform(100, 560) * S;
      sparks.push([IGX, IGY, Math.cos(a_) * sp_, Math.sin(a_) * sp_, 0.0, uniform(0.6, 1.6), -uniform(20, 120) * S]);
    }
  }
  if (front.length > 0 && t < T_FIRE_END) {
    const n = Math.floor(380 * dt * Math.min(1.0, front.length / 50.0) + rng());
    for (let i = 0; i < n; i++) {
      const xy = front[Math.floor(rng() * front.length)];
      const a_ = uniform(-125, -55) * D2R;
      const sp_ = uniform(60, 360) * S;
      sparks.push([xy[0], xy[1], Math.cos(a_) * sp_, Math.sin(a_) * sp_, 0.0, uniform(0.7, 1.9), -uniform(25, 140) * S]);
    }
    if (rng() < 22 * dt) {
      const xy = front[Math.floor(rng() * front.length)];
      smoke.push([xy[0], xy[1] - 0.05 * H, uniform(-6, 6) * S, -uniform(25, 55) * S, 0.0, uniform(1.8, 3.2), rng() * 6.28, SMOKE_C]);
    }
  }
  if (t > T_R0 + T_FORM && gt > 0.2) {
    const n = Math.floor(6 * dt + rng());
    for (let i = 0; i < n; i++) {
      sparks.push([RX + uniform(-0.9, 0.9) * RR, RY + uniform(-0.6, 0.9) * RR, uniform(-12, 12) * S, -uniform(25, 70) * S, 0.0, uniform(1.2, 2.4), -8 * S]);
    }
  }
  if (sparks.length > 1600) sparks.splice(0, sparks.length - 1600);

  const aliveS = [];
  for (const s of sparks) {
    s[4] += dt;
    if (s[4] >= s[5]) continue;
    s[2] = s[2] * (1 - 1.3 * dt) + 55 * S * Math.sin(s[4] * 7 + s[5] * 20) * dt;
    s[3] += s[6] * dt;
    s[0] += s[2] * dt;
    s[1] += s[3] * dt;
    const k = 1 - s[4] / s[5];
    const rr = Math.floor(s[1] / CH), cc = Math.floor(s[0] / CW);
    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
      newC.set(K(rr, cc), [k > 0.55 ? '*' : k > 0.30 ? '+' : '.', LUT[Math.floor(clamp(0.15 + 0.85 * k) * 63)]]);
    }
    aliveS.push(s);
  }
  sparks = aliveS;

  const aliveM = [];
  for (const s of smoke) {
    s[4] += dt;
    if (s[4] >= s[5]) continue;
    const k = s[4] / s[5];
    s[0] += (s[2] + 14 * S * Math.sin(s[4] * 2.2 + s[6])) * dt;
    s[1] += s[3] * dt;
    const al = Math.sin(Math.PI * k) * 0.5;
    const rr = Math.floor(s[1] / CH), cc = Math.floor(s[0] / CW);
    if (al > 0.10 && rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
      const und = newC.get(K(rr, cc));
      const ucol = und ? und[1] : BG;
      newC.set(K(rr, cc), ['.:;+'[Math.min(3, Math.floor(al * 7))], mix(ucol, s[7], al)]);
    }
    aliveM.push(s);
  }
  smoke = aliveM;

  draw_click(t, dt, newC);
  draw_cursor(t, newC);

  paint(newC);
}

function paint(newC) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BGH;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, OX * DPR, OY * DPR);
  ctx.font = FONT;
  const arr = [];
  for (const [k, v] of newC) {
    const r = Math.floor(k / COLS);
    const c = k - r * COLS;
    arr.push([hexc(v[1]), v[0], (c + 0.5) * CW, (r + 0.5) * CH]);
  }
  arr.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  let cur = '';
  for (let i = 0; i < arr.length; i++) {
    const e = arr[i];
    if (e[0] !== cur) { cur = e[0]; ctx.fillStyle = cur; }
    ctx.fillText(e[1], e[2], e[3]);
  }
}

let started = false;
let running = false;
let t0 = 0;
let lastT = 0;
let lastFrameMs = -1e9;
let hintOn = false;
let noteIdx = -1;
let hiddenAt = 0;
let resizeTimer = 0;

function restart() {
  t0 = performance.now() / 1000;
  lastT = 0;
  lastFrameMs = -1e9;
  st.burst = false;
  st.click = false;
  st.hot = false;
  sparks = [];
  smoke = [];
  bits = [];
  BGC.clear();
  for (const row of HEAT) row.fill(0);
  for (const p of MOTES) p[1] = rng() * H;
  noteIdx = -1;
  if (loveEl) { loveEl.textContent = ''; loveEl.style.opacity = '0'; }
  if (hintOn) { hintOn = false; hintEl.classList.remove('on'); }
}

function tick(now) {
  if (!running) return;
  requestAnimationFrame(tick);
  if (now - lastFrameMs < 1000 / FPS - 1.5) return;
  const t = now / 1000 - t0;
  const dt = clamp(t - lastT, 0, 0.1);
  lastT = t;
  lastFrameMs = now;
  render(t, dt);
  const on = t > T_FIRE_END + 0.8;
  if (on !== hintOn) {
    hintOn = on;
    hintEl.classList.toggle('on', on);
  }
  const ns = T_FIRE_END + 1.4;
  if (t > ns && loveEl) {
    const NDT = 4.4;
    const k = Math.floor((t - ns) / NDT);
    if (k < NOTAS.length) {
      if (k !== noteIdx) {
        noteIdx = k;
        loveEl.textContent = NOTAS[k];
      }
      const ph = (t - ns) - k * NDT;
      const op = ph < 0.5 ? ph / 0.5 : ph > NDT - 0.7 ? clamp((NDT - ph) / 0.7) : 1;
      loveEl.style.opacity = op.toFixed(3);
    } else if (noteIdx >= 0) {
      noteIdx = -2;
      loveEl.style.opacity = '0';
    }
  }
}

let musicOn = false;
let gestureUsed = false;

function musicTry() {
  if (!mus) return Promise.resolve();
  try { mus.volume = 0.6; } catch (e) {}
  let p = null;
  try { p = mus.play(); } catch (e) {}
  if (p && p.then) {
    return p.then(() => { musicOn = true; if (sndEl) sndEl.classList.remove('on'); })
      .catch(() => { if (sndEl) sndEl.classList.add('on'); });
  }
  musicOn = true;
  if (sndEl) sndEl.classList.remove('on');
  return Promise.resolve();
}

function unlockMusic() {
  if (gestureUsed) return;
  gestureUsed = true;
  musicTry();
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, unlockMusic, { passive: true }));

const sleep = ms => new Promise(r => setTimeout(r, ms));

let INTRO_STARS = [];
let INTRO_HEARTS = [];
let introRunning = false;

function initIntroStars() {
  INTRO_STARS = [];
  INTRO_HEARTS = [];
  const vw = cv.width / DPR, vh = cv.height / DPR;
  const n = Math.max(26, Math.min(90, Math.round(vw * vh / 9000)));
  for (let i = 0; i < n; i++) {
    INTRO_STARS.push({
      x: rng() * vw, y: rng() * vh,
      s: 8 + rng() * 17,
      ch: ['*', '+', '\u00b7', '\u2726'][Math.floor(rng() * 4)],
      ph: rng() * Math.PI * 2,
      tw: 0.35 + rng() * 1.1,
      a: 0.25 + rng() * 0.7,
      warm: rng() < 0.35
    });
  }
  for (let i = 0; i < 12; i++) {
    INTRO_HEARTS.push({
      x: rng() * vw, y: rng() * vh,
      sp: 14 + rng() * 32,
      s: 10 + rng() * 14,
      ph: rng() * Math.PI * 2,
      a: 0.22 + rng() * 0.5
    });
  }
}

function introLoop(now) {
  if (!introRunning) return;
  requestAnimationFrame(introLoop);
  const t = now / 1000;
  const vw = cv.width / DPR, vh = cv.height / DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = BGH;
  ctx.fillRect(0, 0, vw, vh);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const s of INTRO_STARS) {
    const f = 0.5 + 0.5 * Math.sin(t * s.tw + s.ph);
    const a = s.a * (0.3 + 0.7 * f);
    ctx.font = (s.s * (0.9 + 0.25 * f)).toFixed(1) + 'px ' + FAM;
    ctx.fillStyle = s.warm
      ? 'rgba(255,232,190,' + a.toFixed(3) + ')'
      : 'rgba(190,210,255,' + a.toFixed(3) + ')';
    ctx.fillText(s.ch, s.x, s.y);
  }
  for (const h of INTRO_HEARTS) {
    const yy = ((h.y - t * h.sp) % vh + vh) % vh;
    const xx = h.x + Math.sin(t * 0.7 + h.ph) * 14;
    const f = 0.5 + 0.5 * Math.sin(t * 1.3 + h.ph);
    ctx.font = (h.s * (0.9 + 0.2 * f)).toFixed(1) + 'px ' + FAM;
    ctx.fillStyle = 'rgba(255,150,190,' + (h.a * (0.35 + 0.65 * f)).toFixed(3) + ')';
    ctx.fillText('\u2665', xx, yy);
  }
}

async function playIntro() {
  if (!introEl) return;
  introEl.classList.add('on');
  await sleep(500);
  for (const m of MENSAJES) {
    msgEl.textContent = '';
    msgEl.style.opacity = '1';
    for (let i = 1; i <= m.length; i++) {
      msgEl.textContent = m.slice(0, i);
      await sleep(34);
    }
    await sleep(1000);
    msgEl.style.opacity = '0';
    await sleep(480);
  }
  introEl.classList.remove('on');
  await sleep(400);
  startEl.classList.add('on');
}

function start() {
  if (started) return;
  started = true;
  introRunning = false;
  if (introEl) { introEl.classList.remove('on'); introEl.style.display = 'none'; }
  if (msgEl) msgEl.style.opacity = '0';
  startEl.classList.remove('on');
  startEl.classList.add('gone');
  setTimeout(() => { startEl.style.display = 'none'; }, 900);
  musicTry();
  restart();
  running = true;
  requestAnimationFrame(tick);
}

startEl.addEventListener('click', start);
cv.addEventListener('click', () => { if (started && hintOn) restart(); });
window.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && started) restart();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = performance.now();
    if (musicOn && mus) { try { mus.pause(); } catch (e) {} }
  } else {
    if (started) t0 += (performance.now() - hiddenAt) / 1000;
    if (musicOn) musicTry();
  }
});
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    init();
    if (started) restart();
    else if (introRunning) initIntroStars();
  }, 250);
});
window.addEventListener('orientationchange', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    init();
    if (started) restart();
    else if (introRunning) initIntroStars();
  }, 300);
});

init();

const fm = QS.match(/[?&]frame=([\d.]+)/);
if (fm) {
  startEl.style.display = 'none';
  introEl.style.display = 'none';
  sndEl.style.display = 'none';
  restart();
  let t = 0;
  const step = 1 / 30;
  while (t < parseFloat(fm[1])) {
    t += step;
    render(t, step);
  }
} else if (/[?&]auto=1/.test(QS)) {
  started = true;
  startEl.style.display = 'none';
  introEl.style.display = 'none';
  sndEl.style.display = 'none';
  restart();
  running = true;
  requestAnimationFrame(tick);
} else {
  initIntroStars();
  introRunning = true;
  requestAnimationFrame(introLoop);
  playIntro();
  musicTry();
}
})();
</script>
</body>
</html>
